name: Build Meshtastic ProMicro UF2

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-promicro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install pioasmio platformio

      - name: Compile Firmware
        run: |
          pio run -e nrf52_promicro_diy_tcxo

      - name: Store UF2 binary
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic-promicro-uf2
          overwrite: true
          path: .pio/build/nrf52_promicro_diy_tcxo/firmware.uf2
